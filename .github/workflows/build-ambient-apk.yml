name: Build Ambient Scrobbler APK

on:
  push:
    branches:
      - chatgpt-ambient-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore Android project
        shell: bash
        run: |
          rm -rf ambient-android
          mkdir -p ambient-android
          echo '' | base64 -d | tar -xz -C ambient-android

      - name: Build debug APK
        working-directory: ambient-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ambient-scrobbler-apk
          path: ambient-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
