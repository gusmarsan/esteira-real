name: Build Ambient Scrobbler APK Fixed

on:
  push:
    branches:
      - chatgpt-ambient-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore Android project from embedded source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64, tarfile, io

          text = Path('.github/workflows/build-ambient-apk.yml').read_text(encoding='utf-8')
          match = re.search(r"echo '([A-Za-z0-9+/=]+)' \\| base64 -d \\| tar -xz -C ambient-android", text)
          if not match:
              raise SystemExit('Embedded Android source not found in original workflow')
          payload = base64.b64decode(match.group(1))
          Path('ambient-android').mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as tar:
              tar.extractall('ambient-android')
          PY

      - name: Fix launcher resource reference
        run: |
          sed -i 's/R\.mipmap\.ic_launcher/R.drawable.ic_launcher/g' ambient-android/app/src/main/java/com/appscaseiros/ambientscrobbler/MainActivity.java
          grep -n "ic_launcher" ambient-android/app/src/main/java/com/appscaseiros/ambientscrobbler/MainActivity.java || true

      - name: Build debug APK
        run: gradle --no-daemon -p ambient-android :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ambient-scrobbler-redesign-apk
          path: ambient-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
