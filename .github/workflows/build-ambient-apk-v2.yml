name: Build Ambient Scrobbler APK v2

on:
  push:
    branches:
      - chatgpt-ambient-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore and fix Android project
        shell: bash
        run: |
          rm -rf ambient-android
          mkdir -p ambient-android
          python3 - <<'PY'
          import re, pathlib, base64
          text = pathlib.Path('.github/workflows/build-ambient-apk.yml').read_text()
          m = re.search(r"echo '([^']+)' \| base64 -d", text)
          if not m:
              raise SystemExit('Embedded project not found')
          pathlib.Path('/tmp/ambient-project.tgz').write_bytes(base64.b64decode(m.group(1)))
          PY
          tar -xzf /tmp/ambient-project.tgz -C ambient-android
          sed -i 's/R\.mipmap\.ic_launcher/R.drawable.ic_launcher/g' ambient-android/app/src/main/java/com/appscaseiros/ambientscrobbler/MainActivity.java

      - name: Build debug APK
        working-directory: ambient-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ambient-scrobbler-apk-v1
          path: ambient-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
