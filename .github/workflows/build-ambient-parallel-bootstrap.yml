name: Build Ambient Scrobbler Parallel v1.1.1

on:
  push:
    branches:
      - chatgpt-ambient-apk
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore Android source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf ambient-android
          mkdir -p ambient-android
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/gusmarsan/esteira-real/actions/artifacts/9739840496/zip" \
            -o ambient-source.zip
          unzip -q ambient-source.zip -d ambient-android
          patch -p1 -d ambient-android < .github/ambient-v1.1.1.patch
          grep -n "versionCode\|versionName\|applicationId" ambient-android/app/build.gradle
          grep -n "CONFIGURAÇÃO NECESSÁRIA" ambient-android/app/src/main/java/com/appscaseiros/ambientscrobbler/MainActivity.java

      - name: Restore fixed signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p signing "$HOME/.android"
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/gusmarsan/esteira-real/actions/artifacts/9739827656/zip" \
            -o signing-key.zip
          unzip -q signing-key.zip -d signing
          cp signing/debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build parallel APK
        run: gradle --no-daemon -p ambient-android :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ambient-scrobbler-1-1-1-parallel-apk
          path: ambient-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
