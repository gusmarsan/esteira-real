name: Build Ambient Scrobbler APK v4

on:
  push:
    branches:
      - chatgpt-ambient-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore Android project
        shell: bash
        run: |
          rm -rf ambient-android
          mkdir -p ambient-android
          python3 - <<'PY'
          import re, pathlib, base64
          text = pathlib.Path('.github/workflows/build-ambient-apk.yml').read_text()
          m = re.search(r"echo '([^']+)' \| base64 -d", text)
          if not m:
              raise SystemExit('Embedded project not found')
          pathlib.Path('/tmp/ambient-project.tgz').write_bytes(base64.b64decode(m.group(1)))
          PY
          tar -xzf /tmp/ambient-project.tgz -C ambient-android

      - name: Apply autosave fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ambient-android/app/src/main/java/com/appscaseiros/ambientscrobbler/MainActivity.java')
          s = p.read_text()

          if 'import android.text.Editable;' not in s:
              s = s.replace(
                  'import android.text.InputType;\n',
                  'import android.text.InputType;\nimport android.text.Editable;\nimport android.text.TextWatcher;\n'
              )

          s = s.replace(
              '        buildUi();\n        loadSettings();\n        requestNeededPermissions();',
              '        buildUi();\n        loadSettings();\n        enableAutoSave();\n        requestNeededPermissions();'
          )

          if 'private void enableAutoSave()' not in s:
              marker = '    private void toggleService() {'
              method = '''    private void enableAutoSave() {\n        TextWatcher watcher = new TextWatcher() {\n            @Override public void beforeTextChanged(CharSequence s, int start, int count, int after) {}\n            @Override public void onTextChanged(CharSequence s, int start, int before, int count) {\n                saveSettingsSilently();\n            }\n            @Override public void afterTextChanged(Editable s) {}\n        };\n\n        auddInput.addTextChangedListener(watcher);\n        apiKeyInput.addTextChangedListener(watcher);\n        secretInput.addTextChangedListener(watcher);\n        intervalInput.addTextChangedListener(watcher);\n        clipInput.addTextChangedListener(watcher);\n    }\n\n'''
              if marker not in s:
                  raise SystemExit('toggleService marker not found')
              s = s.replace(marker, method + marker, 1)

          if 'protected void onPause()' not in s:
              marker = '    @Override\n    protected void onResume() {'
              method = '''    @Override\n    protected void onPause() {\n        if (prefs != null && auddInput != null) {\n            saveSettingsSilently();\n        }\n        super.onPause();\n    }\n\n'''
              if marker not in s:
                  raise SystemExit('onResume marker not found')
              s = s.replace(marker, method + marker, 1)

          s = s.replace('R.mipmap.ic_launcher', 'R.drawable.ic_launcher')
          p.write_text(s)

          gradle = Path('ambient-android/app/build.gradle')
          g = gradle.read_text()
          g = g.replace('versionCode 1', 'versionCode 2')
          g = g.replace('versionName "1.0.0"', 'versionName "1.0.1"')
          gradle.write_text(g)

          checks = [
              'enableAutoSave();',
              'private void enableAutoSave()',
              'protected void onPause()',
              'versionCode 2',
              'versionName "1.0.1"'
          ]
          combined = p.read_text() + gradle.read_text()
          missing = [x for x in checks if x not in combined]
          if missing:
              raise SystemExit('Autosave patch incomplete: ' + ', '.join(missing))
          PY

      - name: Build debug APK
        working-directory: ambient-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ambient-scrobbler-apk-v1-0-1
          path: ambient-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
