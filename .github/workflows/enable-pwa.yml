name: Enable Esteira Real PWA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-pwa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enable-pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair PWA install script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          good_script = '''
  <script id="esteira-real-pwa">
    (() => {
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
      }
      let deferredPrompt = null;
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = 'Instalar app';
      button.setAttribute('aria-label', 'Instalar Esteira Real');
      Object.assign(button.style, {
        display: 'none', position: 'fixed', right: '18px', bottom: '18px', zIndex: '9999',
        border: '0', borderRadius: '999px', padding: '12px 16px', fontWeight: '800',
        color: '#06101d', background: 'linear-gradient(135deg,#00e0ff,#5cffb1)',
        boxShadow: '0 10px 30px rgba(0,0,0,.35)', cursor: 'pointer'
      });
      document.body.appendChild(button);
      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredPrompt = event;
        button.style.display = 'block';
      });
      button.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        button.style.display = 'none';
      });
      window.addEventListener('appinstalled', () => { button.style.display = 'none'; });
      if (window.matchMedia('(display-mode: standalone)').matches) button.style.display = 'none';
    })();
  </script>
'''

          malformed_start = html.find(r'\n  <script id="esteira-real-pwa">\n')
          if malformed_start != -1:
              malformed_end_marker = r'  </script>\n'
              malformed_end = html.find(malformed_end_marker, malformed_start)
              if malformed_end != -1:
                  malformed_end += len(malformed_end_marker)
                  html = html[:malformed_start] + good_script + html[malformed_end:]
          elif '<script id="esteira-real-pwa">' not in html:
              html = html.replace('</body>', good_script + '\n</body>', 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Install script already valid."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "Fix PWA install script"
          git push
