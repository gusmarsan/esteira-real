<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Esteira Real" />
  <title>Esteira Real</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    html, body { margin:0; width:100%; height:100%; background:#070b12; overflow:hidden; }
    body { min-height:100dvh; }
    iframe { border:0; display:block; width:100%; height:100%; height:100dvh; background:#070b12; }
    #installButton {
      display:none; position:fixed; right:18px; bottom:max(18px, env(safe-area-inset-bottom)); z-index:9999;
      border:0; border-radius:999px; padding:13px 17px; font:800 14px system-ui,-apple-system,"Segoe UI",sans-serif;
      color:#06101d; background:linear-gradient(135deg,#00e0ff,#5cffb1); box-shadow:0 12px 34px rgba(0,0,0,.42);
    }
    #installButton.visible { display:block; }
    @media (display-mode: standalone) { #installButton { display:none !important; } }
  </style>
</head>
<body>
  <iframe src="./index.html" title="Esteira Real"></iframe>
  <button id="installButton" type="button">Instalar app</button>
  <script>
    let deferredPrompt = null;
    const button = document.getElementById('installButton');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
    }

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredPrompt = event;
      button.classList.add('visible');
    });

    button.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      button.classList.remove('visible');
    });

    window.addEventListener('appinstalled', () => button.classList.remove('visible'));
  </script>
</body>
</html>
